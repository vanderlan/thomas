server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Thomas API (the "api" service of docker-compose). "/api/Projects" -> "http://api/Projects"
    location /api/ {
        proxy_pass http://api:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles can be cached for a long time
    location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular router: every other path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
