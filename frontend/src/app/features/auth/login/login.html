<main class="login">
  <section class="login__card card">
    <header class="login__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">T</span>
        <div>
          <h1 class="brand__title">Thomas</h1>
          <p class="brand__subtitle">Errors knowledge base</p>
        </div>
      </div>
      <button
        type="button"
        class="btn btn--ghost btn--icon"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        {{ theme.isDark() ? '☀' : '☾' }}
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error">Inform a valid e-mail</span>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__error">Inform the password</span>
        }
      </div>

      @if (error(); as message) {
        <p class="alert alert--error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
